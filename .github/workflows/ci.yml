name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias
        run: npx vitest run --exclude "tests/integration/**"
      - name: Datos estáticos coherentes (huella del manifiesto, contenido y programas)
        run: npm run data:verify
      - name: Build público
        run: npm run build:public
      - name: Prueba de humo del build (sin base de datos)
        run: |
          PORT=3098 node .output/server/index.mjs &
          for i in $(seq 1 30); do curl -sf http://localhost:3098/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3098/data/surveys.json
          curl -sf -o /dev/null http://localhost:3098/programas
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3098/api/auth/session)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3098/admin)" = "404"

  secretos:
    name: secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
