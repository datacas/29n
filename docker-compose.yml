version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${NUXT_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-app}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-affinity}
      - STORAGE_PATH=/app/storage
      - WORKER_SCRIPT=/app/services/document-worker/extract.py
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Admin}
      - BREVO_TEMPLATE_ID=${BREVO_TEMPLATE_ID:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - OTP_SECRET=${OTP_SECRET:-}
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-affinity}
      - POSTGRES_USER=${DB_USER:-app}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
